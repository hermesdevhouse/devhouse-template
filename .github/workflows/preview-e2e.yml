# Playwright + axe against the Workers Builds preview for this PR's head commit.
# Skips cleanly until the repo variable PREVIEW_URL_TEMPLATE is set (after Workers Builds is
# connected), e.g. https://{branch}-devhouse-template.<subdomain>.workers.dev
# Previews hold fake data only and are not behind Access, so this job needs no secret (D25).
name: preview-e2e

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    if: vars.PREVIEW_URL_TEMPLATE != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Fork PRs get no preview
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Workers Builds does not build fork branches, so there is no preview to test."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Resolve the preview URL and wait until it serves this commit
        env:
          BRANCH: ${{ github.head_ref }}
          TEMPLATE: ${{ vars.PREVIEW_URL_TEMPLATE }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          slug=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          url=${TEMPLATE//\{branch\}/$slug}
          case "$url" in https://*.workers.dev) ;; *) echo "::error::bad preview URL"; exit 1;; esac
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            got=$(curl -fsS --max-time 10 "$url/api/health" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            [ "$got" = "$SHA" ] && { echo "Preview is serving $SHA"; exit 0; }
            sleep 10
          done
          echo "::error::Preview at $url did not serve commit $SHA within 10 minutes"
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            reports/e2e-junit.xml
            reports/e2e.json
            reports/axe.json
          if-no-files-found: ignore
          retention-days: 30
